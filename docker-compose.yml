version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: appclinica_backend
    ports:
      - "3333:3333"
    environment:
      - PORT=3333
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=super-secret-clinic-key-for-internship-eval
      - TIMEZONE=America/Sao_Paulo
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: appclinica_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
